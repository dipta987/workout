<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shiva Physique Program</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:#080E17;color:#E8EAF0;font-family:'Inter',sans-serif;min-height:100%}
:root{
  --navy:#080E17;--navy2:#0D1B2A;--navy3:#162236;--navy4:#1C2D42;
  --saffron:#FF9933;--saffron2:#FFB347;--saffron-dim:rgba(255,153,51,0.15);
  --teal:#00BFA5;--teal-dim:rgba(0,191,165,0.12);
  --purple:#9C27B0;--text1:#F0F2F8;--text2:#94A3B8;--text3:#64748B;
  --border:rgba(255,255,255,0.08);--red:#EF5350;
}
.app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}

/* HEADER */
.hdr{background:linear-gradient(180deg,var(--navy2),var(--navy3));padding:12px 16px 10px;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100}
.hdr-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.hdr-logo{font-family:'Cinzel',serif;font-size:11px;color:var(--saffron);letter-spacing:2.5px}
.hdr-phase{font-size:12px;color:var(--text2);margin-top:2px}
.streak-box{background:var(--saffron-dim);border:1px solid rgba(255,153,51,0.3);border-radius:8px;padding:5px 10px;text-align:center;min-width:64px}
.streak-num{color:var(--saffron);font-family:'Cinzel',serif;font-size:18px;font-weight:700;display:block}
.streak-lbl{color:var(--text3);font-size:9px;letter-spacing:1px;display:block}
.prog-track{height:4px;background:var(--navy4);border-radius:2px}
.prog-fill{height:4px;background:linear-gradient(90deg,var(--saffron),var(--saffron2));border-radius:2px;transition:width .4s ease}
.prog-txt{font-size:10px;color:var(--text3);margin-top:3px}

/* NAV */
.nav{display:flex;background:var(--navy2);border-bottom:1px solid var(--border)}
.nb{flex:1;padding:9px 4px 7px;background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;color:var(--text3);font-size:11px;font-family:'Inter',sans-serif;font-weight:500;letter-spacing:.5px;transition:all .2s}
.nb.on{color:var(--saffron);border-bottom-color:var(--saffron)}

/* CONTENT */
.content{flex:1;overflow-y:auto;padding-bottom:24px}

/* SECTION HEADERS */
.sec-hdr{display:flex;align-items:center;justify-content:space-between;padding:11px 16px;cursor:pointer;background:var(--navy3);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:9}
.sec-lbl{font-family:'Cinzel',serif;font-size:11px;letter-spacing:2px;display:flex;align-items:center;gap:8px}
.sec-dur{font-size:10px;padding:2px 9px;border-radius:99px;font-family:'Inter',sans-serif;font-weight:600}
.sec-toggle{font-size:17px;color:var(--text3);font-weight:300;line-height:1;user-select:none}

/* EXERCISE ITEMS */
.ex-row{display:flex;align-items:flex-start;gap:10px;padding:10px 16px;border-bottom:1px solid var(--border)}
.cb{width:22px;height:22px;flex-shrink:0;margin-top:1px;border:1.5px solid var(--text3);border-radius:6px;background:none;cursor:pointer;position:relative;transition:all .2s}
.cb.done{background:var(--teal);border-color:var(--teal)}
.cb.done::after{content:'';position:absolute;left:6px;top:3px;width:6px;height:10px;border:2px solid #fff;border-top:none;border-left:none;transform:rotate(45deg)}
.ex-body{flex:1;cursor:pointer;min-width:0}
.ex-cat{display:inline-block;font-size:9px;font-weight:700;letter-spacing:1px;padding:1px 6px;border-radius:3px;margin-bottom:3px}
.ex-name{font-size:13px;font-weight:500;color:var(--text1);line-height:1.35}
.ex-name.done{text-decoration:line-through;color:var(--text3)}
.ex-reps{font-size:11px;font-weight:600;color:var(--saffron);margin-top:2px}
.ex-trad{font-size:10px;color:var(--purple);margin-top:1px;font-style:italic}
.timer-btn{flex-shrink:0;background:var(--navy4);border:1px solid var(--border);border-radius:8px;padding:5px 9px;color:var(--teal);font-size:11px;font-family:'Inter',sans-serif;font-weight:600;cursor:pointer;letter-spacing:.3px;margin-top:1px;transition:all .2s;white-space:nowrap}
.timer-btn.active{background:var(--teal-dim);border-color:var(--teal)}

/* CATEGORY COLORS */
.cat-w{background:rgba(0,191,165,0.15);color:#00BFA5}
.cat-push{background:rgba(239,83,80,0.15);color:#EF5350}
.cat-pull{background:rgba(30,136,229,0.15);color:#1E88E5}
.cat-legs{background:rgba(255,152,0,0.15);color:#FF9800}
.cat-core{background:rgba(156,39,176,0.15);color:#CE93D8}
.cat-yoga{background:rgba(216,27,96,0.15);color:#F48FB1}
.cat-qi{background:rgba(0,188,212,0.15);color:#00BCD4}

/* TIMER OVERLAY */
.t-overlay{position:fixed;inset:0;background:rgba(8,14,23,0.96);z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
.t-name{font-size:13px;color:var(--text2);text-align:center;max-width:240px;line-height:1.5}
.t-circle{position:relative;width:180px;height:180px}
.t-circle svg{transform:rotate(-90deg)}
.t-nums{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.t-secs{font-family:'Cinzel',serif;font-size:52px;font-weight:700;color:var(--text1);line-height:1}
.t-state{font-size:10px;color:var(--text3);letter-spacing:1.5px;margin-top:4px}
.t-btns{display:flex;gap:12px}
.t-btn{padding:11px 22px;border-radius:12px;border:none;cursor:pointer;font-family:'Cinzel',serif;font-size:12px;letter-spacing:1px;transition:all .2s}
.t-go{background:var(--saffron);color:var(--navy);font-weight:700}
.t-close{background:var(--navy4);border:1px solid var(--border);color:var(--text2)}

/* DETAIL OVERLAY */
.d-overlay{position:fixed;inset:0;background:rgba(8,14,23,0.98);z-index:200;overflow-y:auto}
.d-inner{padding:18px 16px 48px}
.d-back{background:var(--navy4);border:1px solid var(--border);border-radius:10px;padding:7px 14px;color:var(--text2);font-size:12px;cursor:pointer;font-family:'Inter',sans-serif;margin-bottom:14px;display:inline-block}
.d-title{font-family:'Cinzel',serif;font-size:19px;color:var(--saffron);letter-spacing:1px;margin-bottom:10px;line-height:1.3}
.d-card{background:var(--navy3);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.d-card-lbl{font-size:9px;color:var(--text3);letter-spacing:2px;margin-bottom:6px;text-transform:uppercase}
.d-card-body{font-size:13px;color:var(--text2);line-height:1.75}
.d-phase-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.d-phase-cell{background:var(--navy4);border-radius:8px;padding:9px 8px;text-align:center;border-top:2px solid transparent}
.d-phase-cell.cur{border-top-color:var(--saffron)}
.d-phase-lbl{font-size:9px;color:var(--text3);letter-spacing:1px}
.d-phase-val{font-size:12px;color:var(--saffron);font-weight:600;margin-top:3px;line-height:1.3}

/* PHASE CARD */
.phase-card{margin:12px 16px;background:var(--navy3);border:1px solid var(--border);border-radius:14px;padding:13px 15px;border-left:3px solid var(--saffron)}
.phase-title{font-family:'Cinzel',serif;font-size:13px;color:var(--saffron);letter-spacing:1px}
.phase-row{display:flex;gap:8px;margin-top:8px}
.phase-stat{flex:1;background:var(--navy4);border-radius:8px;padding:7px;text-align:center}
.phase-val{font-family:'Cinzel',serif;font-size:16px;font-weight:700;color:var(--text1);display:block}
.phase-key{font-size:9px;color:var(--text3);letter-spacing:1px;display:block;margin-top:2px}

/* COMPLETE BTN */
.done-btn{display:block;margin:14px 16px;width:calc(100% - 32px);padding:14px;background:linear-gradient(135deg,var(--saffron),var(--saffron2));border:none;border-radius:14px;color:var(--navy);font-family:'Cinzel',serif;font-size:13px;font-weight:700;letter-spacing:1px;cursor:pointer;box-shadow:0 4px 20px rgba(255,153,51,0.3);transition:opacity .2s}
.done-btn:disabled{opacity:.45;cursor:not-allowed}
.remain-txt{text-align:center;font-size:11px;color:var(--text3);padding-bottom:10px}

/* CELEBRATE */
.celebrate{margin:12px 16px;background:linear-gradient(135deg,rgba(255,153,51,0.12),rgba(255,215,0,0.08));border:1px solid rgba(255,153,51,0.3);border-radius:14px;padding:14px 16px;text-align:center}
.cel-title{font-family:'Cinzel',serif;font-size:14px;color:var(--saffron)}
.cel-sub{font-size:12px;color:var(--text2);margin-top:4px;line-height:1.5}
.cel-reset{margin-top:9px;background:none;border:1px solid rgba(255,153,51,0.3);border-radius:8px;padding:4px 12px;color:var(--saffron);font-size:11px;cursor:pointer;font-family:'Inter',sans-serif}

/* GUIDE */
.g-filters{display:flex;gap:6px;padding:10px 16px;overflow-x:auto;scrollbar-width:none}
.g-filters::-webkit-scrollbar{display:none}
.g-fbtn{flex-shrink:0;padding:5px 12px;border-radius:99px;border:1px solid var(--border);background:none;color:var(--text2);font-size:11px;cursor:pointer;font-family:'Inter',sans-serif;transition:all .2s}
.g-fbtn.on{background:var(--saffron-dim);border-color:var(--saffron);color:var(--saffron)}
.g-item{display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid var(--border);cursor:pointer}
.g-item:active{background:var(--navy3)}
.g-dot{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:'Cinzel',serif;font-size:11px;font-weight:700;letter-spacing:.5px}
.g-info .g-name{font-size:13px;font-weight:500;color:var(--text1)}
.g-info .g-sub{font-size:10px;color:var(--text3);margin-top:1px}
.g-info .g-reps{font-size:11px;color:var(--saffron);font-weight:600;margin-top:2px}

/* COACH */
.coach-wrap{display:flex;flex-direction:column;height:calc(100vh - 130px)}
.chat-area{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.chat-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px;text-align:center;gap:10px;height:100%}
.chat-om{font-family:'Cinzel',serif;font-size:56px;color:var(--saffron);opacity:.6;line-height:1}
.chat-title{font-family:'Cinzel',serif;font-size:15px;color:var(--text1);letter-spacing:1px}
.chat-sub{font-size:12px;color:var(--text3);line-height:1.6;max-width:260px}
.bubble{max-width:85%;padding:10px 13px;border-radius:14px;font-size:13px;line-height:1.65;white-space:pre-wrap}
.bubble.user{align-self:flex-end;background:var(--saffron-dim);border:1px solid rgba(255,153,51,0.2);color:var(--text1);border-radius:14px 14px 4px 14px}
.bubble.ai{align-self:flex-start;background:var(--navy3);border:1px solid var(--border);color:var(--text2);border-radius:14px 14px 14px 4px}
.typing{align-self:flex-start;display:flex;gap:4px;padding:12px 16px;background:var(--navy3);border:1px solid var(--border);border-radius:14px 14px 14px 4px}
.typing span{width:7px;height:7px;border-radius:50%;background:var(--text3);animation:bounce 1.2s infinite}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}
.sugg-row{padding:0 16px 8px;display:flex;flex-wrap:wrap;gap:6px}
.sugg{background:var(--navy4);border:1px solid var(--border);border-radius:99px;padding:5px 11px;font-size:11px;color:var(--text2);cursor:pointer;transition:all .2s;font-family:'Inter',sans-serif}
.sugg:hover{border-color:var(--saffron);color:var(--saffron)}
.chat-input-row{padding:10px 16px;background:var(--navy2);border-top:1px solid var(--border);display:flex;gap:8px}
.chat-inp{flex:1;background:var(--navy3);border:1px solid var(--border);border-radius:12px;padding:9px 13px;color:var(--text1);font-size:13px;font-family:'Inter',sans-serif;outline:none;resize:none;line-height:1.4}
.chat-inp::placeholder{color:var(--text3)}
.chat-inp:focus{border-color:rgba(255,153,51,0.4)}
.chat-send{background:var(--saffron);border:none;border-radius:12px;padding:9px 14px;color:var(--navy);font-size:17px;font-weight:700;cursor:pointer;flex-shrink:0}
.chat-send:disabled{opacity:.35;cursor:not-allowed}

/* SETTINGS */
.sett-wrap{padding:14px 16px}
.sett-card{background:var(--navy3);border:1px solid var(--border);border-radius:14px;padding:15px;margin-bottom:12px}
.sett-ttl{font-family:'Cinzel',serif;font-size:11px;color:var(--saffron);letter-spacing:1.5px;margin-bottom:12px}
.m-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.m-btn{aspect-ratio:1;border-radius:10px;border:1.5px solid var(--border);background:none;color:var(--text2);font-family:'Cinzel',serif;font-size:14px;cursor:pointer;transition:all .2s}
.m-btn.on{background:var(--saffron-dim);border-color:var(--saffron);color:var(--saffron)}
.phase-info{background:var(--navy4);border-radius:10px;padding:10px 12px;margin-top:10px;border-left:2px solid var(--saffron)}
.sett-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border)}
.sett-row:last-child{border-bottom:none}
.sett-lbl{font-size:13px;color:var(--text2)}
.sett-val{font-size:13px;color:var(--text1);font-weight:600}
.del-btn{background:rgba(239,83,80,0.1);border:1px solid rgba(239,83,80,0.3);color:var(--red);border-radius:10px;padding:7px 14px;font-size:12px;cursor:pointer;font-family:'Inter',sans-serif;margin-right:8px;margin-top:4px}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script>
'use strict';
const {useState,useEffect,useRef} = React;

// ── STORAGE (works in Claude artifact AND standalone HTML) ────────────────
const store = {
  get(k){
    try{ return localStorage.getItem('spp2-'+k); }catch{ return null; }
  },
  set(k,v){
    try{ localStorage.setItem('spp2-'+k, String(v)); }catch{}
    try{
      if(window.storage && window.storage.set)
        window.storage.set('spp2-'+k, String(v)).catch(()=>{});
    }catch{}
  },
  async getAsync(k){
    try{
      if(window.storage && window.storage.get){
        const r = await window.storage.get('spp2-'+k);
        return r ? r.value : this.get(k);
      }
    }catch{}
    return this.get(k);
  }
};

// ── PHASE DATA (v2 PDF Section 6) ────────────────────────────────────────
const PHASES = [
  {month:1,name:'Foundation',    level:'Beginner',      rounds:2,rest:'90 sec'},
  {month:2,name:'Habit Build',   level:'Beginner+',     rounds:2,rest:'75 sec'},
  {month:3,name:'Volume Build',  level:'Intermediate',  rounds:3,rest:'60 sec'},
  {month:4,name:'Strength Dev',  level:'Intermediate+', rounds:3,rest:'60 sec'},
  {month:5,name:'Advanced',      level:'Advanced',      rounds:4,rest:'45 sec'},
  {month:6,name:'Mastery',       level:'Master',        rounds:4,rest:'45 sec'},
];
// Phase index: M1->0, M2->1, M3-4->2, M5-6->3
const getPI = m => m<=1?0:m<=2?1:m<=4?2:3;

// ── WARM-UP (v2 PDF Section 3) — 8 exercises ─────────────────────────────
const WARMUP = [
  {id:'w1',cat:'w',catLbl:'WARM',name:'Neck Half-Circles',
   target:'Cervical spine, neck muscles',
   reps:['5 each dir, 2 sets','5 each dir, 2 sets','5 each dir, 2 sets','5 each dir, 2 sets'],
   timed:false,
   how:'Drop right ear toward right shoulder. Roll chin slowly to chest, then to left shoulder. NEVER roll the head backward — this compresses the cervical spine. Spend 3-4 seconds per half-circle. Move like honey dripping — slow and smooth.'},
  {id:'w2',cat:'w',catLbl:'WARM',name:'Shoulder Rolls + Chest Opener',
   target:'Upper traps, rhomboids, pec minor',
   reps:['10 fwd + 10 back + 10s hold','10 fwd + 10 back + 10s hold','10 fwd + 10 back + 10s hold','10 fwd + 10 back + 10s hold'],
   timed:false,
   how:'Roll shoulders: up, back, down, forward (backward rolls). Then interlace hands behind your back, straighten arms, squeeze shoulder blades together and lift chest upward. Hold 10 seconds. This directly counters the computer hunch.'},
  {id:'w3',cat:'w',catLbl:'WARM',name:'Cat-Cow Stretch',
   target:'Thoracic and lumbar spine, core',
   reps:['10 cycles, 2 sets','10 cycles, 2 sets','10 cycles, 2 sets','10 cycles, 2 sets'],
   timed:false,
   how:'On hands and knees, wrists under shoulders, knees under hips. COW: inhale, let belly drop toward floor, lift head and tailbone up. CAT: exhale, round spine toward ceiling, tuck chin to chest. Move vertebra by vertebra, 3 seconds each position. Breathe is the engine.'},
  {id:'w4',cat:'w',catLbl:'WARM',name:'Hip Flexor Lunge Stretch',
   target:'Psoas, iliacus, hip flexors',
   reps:['30 sec each side, 2 rounds','30 sec each side, 2 rounds','30 sec each side, 2 rounds','30 sec each side, 2 rounds'],
   timed:true,seconds:[30,30,30,30],
   how:'Step right foot forward into lunge. Drop left knee to floor. Keep torso TALL and upright. Push hips FORWARD and slightly down until you feel deep stretch in the front of the left hip. Optional: raise left arm overhead and lean slightly right to deepen psoas stretch. The hip being stretched is the BACK leg.'},
  {id:'w5',cat:'w',catLbl:'WARM',name:'Thread-the-Needle (T-spine Rotation)',
   target:'Thoracic vertebrae, rotator cuff',
   reps:['10 each side, 2 sets','10 each side, 2 sets','10 each side, 2 sets','10 each side, 2 sets'],
   timed:false,
   how:'Tabletop position (on hands and knees). Place right hand behind head. Inhale. Exhale and rotate right elbow toward ceiling as high as possible — pause 1 second. Inhale and thread right arm under left arm along floor — pause 1 second. Hips stay square — ONLY the thoracic spine moves.'},
  {id:'w6',cat:'w',catLbl:'WARM',name:'Glute Bridge',
   target:'Glutes, hamstrings, lumbar spine',
   reps:['15 reps, 2 sets','15 reps, 2 sets','20 reps, 2 sets','20 reps, 2 sets'],
   timed:false,
   how:'Lie on back, knees bent, feet flat hip-width apart, arms at sides. Exhale and squeeze glutes HARD, driving hips toward ceiling until body forms straight line from knees to shoulders. PAUSE 2 seconds at top squeezing maximally. Lower slowly on 3-count. All power from glutes — NOT the lower back.'},
  {id:'w7',cat:'w',catLbl:'WARM',name:"World's Greatest Stretch",
   target:'Hip flexors, groin, thoracic spine, hamstrings',
   reps:['5 reps each side','5 reps each side','5 reps each side','5 reps each side'],
   timed:false,
   how:'Step right foot forward to deep lunge. Place both hands on floor inside right foot. Drop left knee to floor. Now rotate right arm UP toward ceiling, opening chest to the right. Hold 2 seconds. Return hand to floor. Straighten both legs (like downward dog) to stretch hamstrings. Repeat. This single exercise undoes more desk damage than any other stretch.'},
  {id:'w8',cat:'w',catLbl:'WARM',name:'Ankle Circles + Calf Raises',
   target:'Ankles, calves, blood circulation',
   reps:['10 circles each dir + 15 raises','10 circles each dir + 15 raises','10 circles each dir + 15 raises','10 circles each dir + 15 raises'],
   timed:false,
   how:'Lift right foot and rotate in large circles — 10 clockwise, 10 counter-clockwise. Swap feet. Then stand feet hip-width apart. Rise up on tiptoes as high as possible, hold 1 second at top, slowly lower. Think of drawing the biggest circles possible with your big toe.'},
];

// ── MAIN CIRCUIT (v2 PDF Section 4) — 12 exercises ───────────────────────
const CIRCUIT = [
  // PUSH
  {id:'c1',cat:'push',catLbl:'PUSH',name:'Push-Up (Wall to Floor)',
   target:'Chest, triceps, anterior deltoid, core',
   reps:['Wall Push-Up: 3x10-12','Floor Push-Up: 3x8-10','3x12-15','4x15-20'],
   timed:false,
   how:'MONTH 1 — WALL PUSH-UP: Stand arm\'s length from a wall. Hands flat on wall at chest height, slightly wider than shoulder-width. Rigid straight-line body. Lower chest to wall on 3-second count. Pause, then push back. Wall is your gym in Month 1.\n\nMONTH 2 ONWARDS — FLOOR PUSH-UP: Hands slightly wider than shoulders on floor. Same rigid plank body from head to heels. Lower chest to 1-2 cm from floor. Pause 1 second. Explosively push back up. Elbows track at 45 degrees — never flare wide to 90 degrees.'},
  {id:'c2',cat:'push',catLbl:'PUSH',name:'Wide Push-Up',
   target:'Outer chest, anterior deltoid',
   reps:['2x6-8','2x6-8','3x10-12','3x12-15'],
   timed:false,
   how:'Same as standard push-up but place hands about 1.5 times shoulder-width apart. This places more emphasis on the outer chest and shoulder girdle. Elbows flare slightly outward at about 45 degrees. Lower chest between your hands. Cue: Elbows track at 45 degrees — not straight out, not pinned back.'},
  {id:'c3',cat:'push',catLbl:'PUSH',name:'Diamond (Tricep) Push-Up',
   target:'Triceps, inner chest, anterior deltoid',
   reps:['2x5-6','2x5-6','3x8-10','3x10-12'],
   timed:false,
   how:'Place both hands close together under your chest, forming a diamond shape with thumbs and index fingers. Keep elbows CLOSE to your body as you lower down — they should scrape your torso on the way down. This is the hardest push-up variant and powerfully develops the triceps. Beginners: do from knees if needed.'},

// ── TIMER HOOK ────────────────────────────────────────────────────────────
function useTimer(){
  const [active,setActive] = useState(null);
  const [secs,setSecs]     = useState(0);
  const [init,setInit]     = useState(0);
  const [running,setRunning] = useState(false);
  const ref = useRef(null);
  useEffect(()=>{
    if(running && secs>0){ ref.current = setTimeout(()=>setSecs(s=>s-1),1000); }
    else if(running && secs===0){ setRunning(false); }
    return ()=>clearTimeout(ref.current);
  },[running,secs]);
  const start = (id,s)=>{ clearTimeout(ref.current); setActive(id); setSecs(s); setInit(s); setRunning(true); };
  const stop  = ()=>{ clearTimeout(ref.current); setRunning(false); setActive(null); setSecs(0); setInit(0); };
  const toggle= (id,s)=>{
    if(active===id && running) setRunning(false);
    else if(active===id && !running) setRunning(true);
    else start(id,s);
  };
  return {active,secs,init,running,start,stop,toggle};
}

          E('div',{className:'hdr-logo'},'SHIVA PHYSIQUE PROGRAM'),
          E('div',{className:'hdr-phase'},`Month ${month} — ${phase.name} (${phase.level})`)),
        E('div',{className:'streak-box'},
          E('span',{className:'streak-num'},streak),
          E('span',{className:'streak-lbl'},'DAY STREAK'))),
      E('div',{className:'prog-track'},
        E('div',{className:'prog-fill',style:{width:`${pct}%`}})),
      E('div',{className:'prog-txt'},`Today: ${done} / ${ALL_EX.length} exercises — ${pct}%`)),

    // Nav
    E('div',{className:'nav'},
      [['today','TODAY'],['guide','GUIDE'],['coach','COACH'],['settings','SET']].map(([t,l])=>
        E('button',{key:t,className:`nb ${tab===t?'on':''}`,onClick:()=>setTab(t)},l))),

    // Content
    E('div',{className:'content'},
      tab==='today'     && E(TodayView,{pi:safePI,phase,comp,toggle,openSec,setOpenSec,timer,done,pct,markDone,celebrated,setCelebrated,setDetail}),
      tab==='guide'     && E(GuideView,{pi:safePI,gFilter,setGFilter,setDetail}),
      tab==='coach'     && E(CoachView,{chat,chatIn,setChatIn,sendChat,chatLoad,chatEnd}),
      tab==='settings'  && E(SettingsView,{month,setMonth,streak,setStreak,setComp,setCelebrated}))
  );
}

// ── TODAY VIEW ────────────────────────────────────────────────────────────
function TodayView({pi,phase,comp,toggle,openSec,setOpenSec,timer,done,pct,markDone,celebrated,setCelebrated,setDetail}){
  const today = new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});
  const E = React.createElement;

  const makeSection = (id,label,dur,color,data,showTrad)=>{
    const open = openSec===id;
    return E('div',{key:id},
      E('div',{className:'sec-hdr',onClick:()=>setOpenSec(open?null:id)},
        E('div',{className:'sec-lbl',style:{color}},
          label,
          E('span',{className:'sec-dur',style:{background:`${color}22`,color}},dur)),
        E('span',{className:'sec-toggle'}, open?'-':'+')),
      open && E('div',null,
        data.map(ex=>{
          const reps = ex.reps[pi];
          const tSecs = Array.isArray(ex.seconds)?ex.seconds[pi]:ex.seconds;
          const isDone = !!comp[ex.id];
          const isActive = timer.active===ex.id;
          return E('div',{key:ex.id,className:'ex-row'},
            E('button',{className:`cb ${isDone?'done':''}`,
              'aria-label':`Toggle ${ex.name}`,
              onClick:()=>toggle(ex.id)}),
            E('div',{className:'ex-body',onClick:()=>setDetail(ex)},
              E('div',{className:`ex-cat ${catCss[ex.cat]||'cat-w'}`},ex.catLbl),
              E('div',{className:`ex-name ${isDone?'done':''}` },ex.name),
              E('div',{className:'ex-reps'},reps),
              showTrad && ex.tradition && E('div',{className:'ex-trad'},ex.tradition)),
            ex.timed && tSecs && E('button',{
              className:`timer-btn ${isActive?'active':''}`,
              onClick:ev=>{ ev.stopPropagation(); timer.toggle(ex.id,tSecs); }},
              isActive ? (timer.running?`${timer.secs}s`:`${timer.secs}s`) : 'TIMER'));
        })));
  };

  return E('div',null,
    E('div',{style:{padding:'10px 16px 2px'}},
      E('div',{style:{fontSize:10,color:'#64748B',letterSpacing:1}},today.toUpperCase()),
      E('div',{style:{fontSize:11,color:'#FF9933',fontFamily:'Cinzel,serif',letterSpacing:1.5,marginTop:3}},
        `${phase.rounds} ROUNDS — REST ${phase.rest} BETWEEN ROUNDS`)),
    celebrated && E('div',{className:'celebrate'},
      E('div',{className:'cel-title'},'DAY COMPLETE — DISCIPLINE IS THE PATH'),
      E('div',{className:'cel-sub'},'Tomorrow you do it again. Consistency builds kings.'),
      E('button',{className:'cel-reset',onClick:()=>setCelebrated(false)},'Dismiss')),
    makeSection('warmup','WARM-UP','10 min','#00BFA5',WARMUP,false),
    makeSection('circuit','MAIN CIRCUIT','30-40 min','#FF9933',CIRCUIT,false),
    makeSection('eastern','EASTERN VITALITY','15-20 min','#CE93D8',EASTERN,true),
    !celebrated && E('button',{className:'done-btn',onClick:markDone,disabled:pct<100},
      pct===100?'MARK DAY COMPLETE':'MARK DAY COMPLETE'),
    pct<100 && E('div',{className:'remain-txt'},`${ALL_EX.length-done} exercises remaining`));
}

// ── GUIDE VIEW ────────────────────────────────────────────────────────────
function GuideView({pi,gFilter,setGFilter,setDetail}){
  const E = React.createElement;
  const tagged = [
    ...WARMUP.map(e=>({...e,grp:'warmup'})),
    ...CIRCUIT.map(e=>({...e,grp:e.cat})),
    ...EASTERN.map(e=>({...e,grp:e.cat}))
  ];
  const show = gFilter==='all' ? tagged : tagged.filter(e=>e.grp===gFilter||e.cat===gFilter);
  const filters = [['all','All 30'],['w','Warm-Up'],['push','Push'],['pull','Pull'],['legs','Legs'],['core','Core'],['yoga','Yoga'],['qi','Qigong']];
  return E('div',null,
    E('div',{className:'g-filters'},
      filters.map(([v,l])=>E('button',{key:v,className:`g-fbtn ${gFilter===v?'on':''}`,onClick:()=>setGFilter(v)},l))),
    show.map(ex=>{
      const reps = ex.reps[pi];
      const col = catColor[ex.cat]||'#00BFA5';
      return E('div',{key:ex.id,className:'g-item',onClick:()=>setDetail(ex)},
        E('div',{className:'g-dot',style:{background:`${col}22`,color:col}},ex.catLbl||'W'),
        E('div',{className:'g-info'},
          E('div',{className:'g-name'},ex.name),
          E('div',{className:'g-sub'},ex.target||ex.tradition||''),
          E('div',{className:'g-reps'},reps)));
    }));
}

// ── COACH VIEW ────────────────────────────────────────────────────────────
function CoachView({chat,chatIn,setChatIn,sendChat,chatLoad,chatEnd}){
  const E = React.createElement;
  const sugg = [
    'How do I do Mula Bandha correctly?',
    'What is Vajroli Mudra for PE?',
    'I missed 3 days — what to do?',
    'What to eat before workout on budget?',
    'How to progress from wall to floor push-up?',
    'How long until I see results?'
  ];
  return E('div',{className:'coach-wrap'},
    E('div',{className:'chat-area'},
      chat.length===0 && E('div',{className:'chat-empty'},
        E('div',{className:'chat-om'},'OM'),
        E('div',{className:'chat-title'},'YOUR AI COACH'),
        E('div',{className:'chat-sub'},'Ask anything about your workout, Eastern practices, PE/ED prevention, nutrition, or recovery. I know the entire Shiva Physique Program.')),
      chat.map((m,i)=>E('div',{key:i,className:`bubble ${m.role==='user'?'user':'ai'}`},m.content)),
      chatLoad && E('div',{className:'typing'},
        E('span'), E('span'), E('span')),
      E('div',{ref:chatEnd})),
    chat.length===0 && E('div',{className:'sugg-row'},
      sugg.map((s,i)=>E('button',{key:i,className:'sugg',onClick:()=>sendChat(s)},s))),
    E('div',{className:'chat-input-row'},
      E('textarea',{className:'chat-inp',rows:2,
        placeholder:'Ask your coach anything...',
        value:chatIn, onChange:e=>setChatIn(e.target.value),
        onKeyDown:e=>{ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendChat();} }}),
      E('button',{className:'chat-send',disabled:chatLoad||!chatIn.trim(),
        onClick:()=>sendChat()},'>')));
}

// ── SETTINGS VIEW ─────────────────────────────────────────────────────────
function SettingsView({month,setMonth,streak,setStreak,setComp,setCelebrated}){
  const E = React.createElement;
  const phase = PHASES[month-1];
  return E('div',{className:'sett-wrap'},
    E('div',{className:'sett-card'},
      E('div',{className:'sett-ttl'},'CURRENT MONTH'),
      E('div',{className:'m-grid'},
        [1,2,3,4,5,6].map(m=>
          E('button',{key:m,className:`m-btn ${month===m?'on':''}`,onClick:()=>setMonth(m)},m))),
      E('div',{className:'phase-info'},
        E('div',{style:{color:'#FF9933',fontFamily:'Cinzel,serif',fontSize:12,letterSpacing:1}},
          phase.name.toUpperCase()+' PHASE'),
        E('div',{style:{color:'#94A3B8',fontSize:11,marginTop:5}},`Level: ${phase.level}`),
        E('div',{style:{color:'#94A3B8',fontSize:11,marginTop:3}},`Rounds per session: ${phase.rounds}`),
        E('div',{style:{color:'#94A3B8',fontSize:11,marginTop:3}},`Rest between rounds: ${phase.rest}`))),
    E('div',{className:'sett-card'},
      E('div',{className:'sett-ttl'},'STATS'),
      E('div',{className:'sett-row'},
        E('span',{className:'sett-lbl'},'Current Month'),
        E('span',{className:'sett-val'},`Month ${month} of 6`)),
      E('div',{className:'sett-row'},
        E('span',{className:'sett-lbl'},'Day Streak'),
        E('span',{className:'sett-val'},`${streak} days`)),
      E('div',{className:'sett-row'},
        E('span',{className:'sett-lbl'},'Total Exercises'),
        E('span',{className:'sett-val'},'30 (8 + 12 + 10)'))),
    E('div',{className:'sett-card'},
      E('div',{className:'sett-ttl'},'RESET'),
      E('button',{className:'del-btn',onClick:()=>{setComp({});setCelebrated(false);}},'Reset Today'),
      E('button',{className:'del-btn',onClick:()=>{setStreak(0);store.set('streak',0);}},'Reset Streak')));
}

// ── MOUNT ─────────────────────────────────────────────────────────────────
ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
